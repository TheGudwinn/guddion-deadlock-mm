name: Release

# Push a tag like v0.2.0 (it must match "version" in tauri.conf.json and Cargo.toml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Needed to create the draft release and upload assets.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # NSIS carries the offline WebView2 runtime; MSI is for managed deployments.
            args: --bundles nsis,msi
          - os: ubuntu-24.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version matches the tag
        shell: bash
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$conf" != "${GITHUB_REF_NAME}" ]; then
            echo "tauri.conf.json version ($conf) does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update packages are signed; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled in as the default update source (see settings::default_update_endpoints).
          DDMM_REPO: ${{ github.repository }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Deadlock Mod Manager ${{ github.ref_name }}
          releaseBody: See the assets below to download and install.
          # A draft lets you check the files before users (and their auto-updaters) can see the release.
          releaseDraft: true
          prerelease: false
          # Uploads latest.json, which the in-app updater reads.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
